<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('promty-theme'); } catch {}
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promty.ir | پلتفرم فارسی آرشیو و شخصی‌سازی پرامپت‌های هوش مصنوعی</title>
    <meta name="description" content="پلتفرم فارسی آرشیو و شخصی‌سازی پرامپت‌های هوش مصنوعی" />
    <meta property="og:title" content="Promty.ir" />
    <meta property="og:description" content="پلتفرم فارسی آرشیو و شخصی‌سازی پرامپت‌های هوش مصنوعی" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
